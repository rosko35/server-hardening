---
# =============================================================================
#  server-hardening - every switch lives here.
#
#  DEFAULT = AUDIT ONLY. With this file unchanged, running the playbooks only
#  READS the server and writes a report on your machine. Nothing on the
#  server is modified.
#
#  To apply ONE category, do not edit this file - pass the switch on the
#  command line, after a dry run:
#     ansible-playbook site.yml --tags ssh -e ssh_hardening_apply=true --check --diff
#     ansible-playbook site.yml --tags ssh -e ssh_hardening_apply=true
#  (the Makefile does exactly this: make apply-ssh CHECK=1, then make apply-ssh)
#
#  Rule enforced by tests/test_defaults.py: every *_apply / risky switch below
#  must default to false.
# =============================================================================

# -----------------------------------------------------------------------------
# Who am I? (normally auto-detected - only set these if detection is wrong)
# -----------------------------------------------------------------------------
# User you log in with. Auto: $SUDO_USER / the SSH login user.
harden_operator_user: ""
# IP you connect from (put in fail2ban ignoreip). Auto: $SSH_CLIENT.
harden_operator_ip: ""

# Where the original copy of every file we touch is kept on the server.
# The rollback playbook restores from here. Never delete it by hand.
harden_backup_root: /var/backups/server-hardening

# Where reports are written on YOUR machine (the control node).
harden_report_dir: "{{ playbook_dir }}/reports"

# -----------------------------------------------------------------------------
# audit (always on, read-only)
# -----------------------------------------------------------------------------
# Max number of world-writable / SUID files listed (keeps the scan fast).
audit_find_limit: 50
# Seconds before the filesystem scans give up (they only scan the root fs).
audit_find_timeout: 120

# -----------------------------------------------------------------------------
# ssh_hardening   risk: HIGH (can lock you out) - see README "Riskiest tasks"
# -----------------------------------------------------------------------------
ssh_hardening_apply: false
# Each value is written into /etc/ssh/sshd_config.d/01-server-hardening.conf.
# An empty string "" means "do not manage this setting".
# PasswordAuthentication "no" is REFUSED unless an authorized key for your
# login user is verified on the server first.
ssh_hardening_settings:
  PermitRootLogin: "no"
  PasswordAuthentication: "no"
  KbdInteractiveAuthentication: "no"
  PubkeyAuthentication: "yes"
  PermitEmptyPasswords: "no"
  MaxAuthTries: "4"
  LoginGraceTime: "30"
  X11Forwarding: "no"
  AllowAgentForwarding: "no"
  ClientAliveInterval: "300"
  ClientAliveCountMax: "3"
  LogLevel: "VERBOSE"
  # Lynis also suggests these, but they can break tunnels / SFTP-heavy use:
  AllowTcpForwarding: ""
  MaxSessions: ""
# The SSH port is never managed by this project (lock-out risk #1).

# -----------------------------------------------------------------------------
# firewall (ufw)   risk: HIGH (can cut off SSH, mail, web)
# -----------------------------------------------------------------------------
firewall_apply: false
# REQUIRED before firewall_apply does anything. List EVERY port that must stay
# reachable from the internet. The current SSH port is always added first.
# Example for a web + mail server:
#   firewall_allowed_ports: ["22/tcp", "80/tcp", "443/tcp", "25/tcp", "465/tcp", "587/tcp", "993/tcp"]
firewall_allowed_ports: []
# Ports that are listening publicly but that you WANT blocked. Anything that
# listens publicly and is in neither list makes the firewall role refuse.
firewall_acknowledge_closing: []
# Also filter IPv6 (ufw IPV6=yes). Keep true unless you know you have no IPv6.
firewall_ipv6: true

# -----------------------------------------------------------------------------
# auto_updates (unattended-upgrades, security pocket only)   risk: LOW
# -----------------------------------------------------------------------------
auto_updates_apply: false
# Packages never upgraded automatically (e.g. ["nginx", "postfix", "dovecot-*"]).
auto_updates_package_blacklist: []
# Never reboots automatically - kept here only so it is visible.
auto_updates_automatic_reboot: false
# Optional e-mail for reports (needs a working local MTA). "" = none.
auto_updates_mail: ""

# -----------------------------------------------------------------------------
# fail2ban (sshd jail)   risk: LOW-MEDIUM (could ban someone - never you)
# -----------------------------------------------------------------------------
fail2ban_apply: false
fail2ban_bantime: "1h"
fail2ban_findtime: "10m"
fail2ban_maxretry: 5
# Extra addresses/networks never banned (your home IP, office VPN...).
# 127.0.0.1/8, ::1 and your current connection IP are always added.
fail2ban_ignoreip_extra: []

# -----------------------------------------------------------------------------
# sysctl_network (conservative network kernel settings)   risk: MEDIUM
# -----------------------------------------------------------------------------
sysctl_network_apply: false
# Applied to /etc/sysctl.d/60-server-hardening.conf. None of these touch
# ip_forward, so Docker / VPN routing is not affected.
sysctl_network_settings:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
# Strict reverse-path filtering (rp_filter=1) can drop legit traffic on
# multi-homed hosts. Only enable it if you know you have a single interface.
sysctl_network_strict_rp_filter: false

# -----------------------------------------------------------------------------
# accounts   risk: LOW (login.defs) / MEDIUM (locking system shells)
# -----------------------------------------------------------------------------
accounts_apply: false
# /etc/login.defs values (affect NEWLY created accounts only). "" = unmanaged.
accounts_login_defs:
  PASS_MAX_DAYS: "365"
  PASS_MIN_DAYS: "1"
  PASS_WARN_AGE: "14"
  # 027 is what Lynis wants, but files your user creates under /var/www would
  # no longer be readable by the web server. Leave "" unless you understand it.
  UMASK: ""
# Second, separate opt-in: set the shell of system accounts (uid < 1000) that
# still have a login shell to /usr/sbin/nologin. Requires accounts_apply too.
accounts_lock_system_shells: false
# Never touched, whatever their shell is.
accounts_shell_lock_exclude: ["root", "sync", "postgres", "git"]

# -----------------------------------------------------------------------------
# file_permissions   risk: LOW (only ever REMOVES permission bits)
# -----------------------------------------------------------------------------
file_permissions_apply: false
file_permissions_targets:
  - { path: /etc/ssh/sshd_config, mode: "0600" }
  - { path: /etc/crontab, mode: "0600" }
  - { path: /etc/cron.d, mode: "0700" }
  - { path: /etc/cron.daily, mode: "0700" }
  - { path: /etc/cron.hourly, mode: "0700" }
  - { path: /etc/cron.weekly, mode: "0700" }
  - { path: /etc/cron.monthly, mode: "0700" }
  - { path: /etc/passwd, mode: "0644" }
  - { path: /etc/group, mode: "0644" }
  - { path: /etc/shadow, mode: "0640" }
  - { path: /etc/gshadow, mode: "0640" }
  - { path: /boot/grub/grub.cfg, mode: "0600" }

# -----------------------------------------------------------------------------
# lynis (independent score)   risk: LOW (installs one package, then only reads)
# -----------------------------------------------------------------------------
lynis_apply: false
# "before" or "after" - which report file to produce.
lynis_label: before
# "package" (distro package, simplest) or "upstream" (pinned tarball).
lynis_install_method: package
lynis_upstream_version: "3.1.4"
lynis_upstream_url: "https://downloads.cisofy.com/lynis/lynis-{{ lynis_upstream_version }}.tar.gz"
# REQUIRED for "upstream": the published SHA-256 of the tarball. The role
# refuses to download without it.
lynis_upstream_sha256: ""

# -----------------------------------------------------------------------------
# rollback
# -----------------------------------------------------------------------------
# Without rollback_confirm=true the rollback playbook only lists what it would
# restore.
rollback_confirm: false
# Which categories to roll back: all, ssh, firewall, auto_updates, fail2ban,
# sysctl, accounts, file_permissions
rollback_categories: ["all"]
