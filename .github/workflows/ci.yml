---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (yamllint, ruff, ansible-lint, syntax-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "ansible-core>=2.16,<2.18" "ansible-lint>=24.2"
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint -s .

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: ansible-lint
        run: ansible-lint

      - name: Playbook syntax check
        run: ansible-playbook -i inventory/localhost.yml --syntax-check site.yml lynis.yml rollback.yml

      - name: Shell scripts
        run: bash -n ci/*.sh

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  integration:
    name: Integration (${{ matrix.name }})
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            base: ubuntu:24.04
          - name: Debian 12
            base: debian:12
    env:
      # Throw-away password for the disposable test container only.
      CI_PASSWORD: ci-throwaway-password-not-secret
      ANSIBLE_FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and test tools
        # Network hiccups (PyPI, Galaxy, apt mirrors) are retried; the output
        # of a step that still fails is attached as an annotation.
        run: |
          retry() { # retry <title> <command...>
            local title=$1 n; shift
            for n in 1 2 3 4; do
              if "$@" > /tmp/retry.log 2>&1; then cat /tmp/retry.log; return 0; fi
              cat /tmp/retry.log
              echo "::warning::$title failed (attempt $n/4), retrying in $((n * 15)) s"
              sleep $((n * 15))
            done
            python3 ci/annotate.py --title "$title failed 4 times" --raw --tail 40 /tmp/retry.log
            return 1
          }
          retry "pip install ansible-core" pip install "ansible-core>=2.16,<2.18"
          retry "ansible-galaxy collection install" ansible-galaxy collection install -r requirements.yml
          retry "apt-get update" sudo apt-get update -q
          retry "apt-get install sshpass" sudo apt-get install -y -q sshpass
          ansible --version

      - name: Build the test target image (${{ matrix.base }})
        run: |
          for n in 1 2 3; do
            if docker build -t hardening-target --build-arg BASE=${{ matrix.base }} ci/ 2>&1 | tee /tmp/build.log; then
              exit 0
            fi
            echo "::warning::docker build failed (attempt $n/3)"
            sleep $((n * 20))
          done
          python3 ci/annotate.py --title "docker build failed" --raw --tail 40 /tmp/build.log
          exit 1

      - name: Start the systemd container
        run: |
          docker run -d --name target --hostname mail.example.test \
            --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /run/lock \
            -p 2222:22 -p 8080:80 -p 2587:587 \
            hardening-target

      - name: Prepare operator account (SSH key + password)
        run: bash ci/prepare-target.sh

      - name: Run integration stages
        run: bash ci/integration.sh

      - name: Diagnostics on failure
        if: failure()
        # Printed as log groups AND as annotations (readable without login).
        run: |
          diag() { # diag <title> <command...>
            local title=$1; shift
            echo "::group::$title"
            "$@" > /tmp/diag.log 2>&1 || true
            cat /tmp/diag.log
            echo "::endgroup::"
            python3 ci/annotate.py --level warning --raw --tail "${TAIL:-30}" --max-parts 1 --title "diag: $title" /tmp/diag.log
          }
          diag "systemctl --failed" docker exec target systemctl --failed --no-pager
          diag "sshd -T (auth/port)" docker exec target sh -c 'sshd -T | grep -Ei "^(port|passwordauth|permitroot|pubkeyauth|kbdinter)"'
          diag "ufw status" docker exec target ufw status verbose
          diag "server-hardening files" docker exec target \
            sh -c 'find /var/backups/server-hardening /etc/ssh/sshd_config.d /etc/sysctl.d -type f 2>&1 | head -60'
          # The container shares the runner's kernel: drop kernel/boot noise of the host.
          TAIL=60 diag "journal (warnings)" docker exec target sh -c \
            'journalctl -p warning -n 300 --no-pager | grep -Ev " (kernel|systemd-fstab-generator.*|setup-dm-snapshot)(\[[0-9]+\])?: |pam_env"'
          echo "::group::journal (last 200 lines)"; docker exec target journalctl -n 200 --no-pager || true; echo "::endgroup::"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.base == 'debian:12' && 'debian12' || 'ubuntu2404' }}
          path: |
            ci/logs/
            reports/
          if-no-files-found: ignore
