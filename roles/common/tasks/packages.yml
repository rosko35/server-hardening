---
# Install packages without trusting a merely "recent" apt cache.
#   input: common_packages  (list of package names)
# apt's cache_valid_time only looks at timestamps: on a server whose package
# lists were emptied (cloud and container images do `rm -rf /var/lib/apt/lists/*`)
# or are older than a new package, the cache looks fresh but cannot install
# anything ("No package matching ... is available"). So first ask apt-cache
# whether every package has an install candidate and refresh the lists if not.
- name: Packages | Check that apt has an install candidate for each package
  ansible.builtin.shell: |
    set -u
    for p in {{ common_packages | map('quote') | join(' ') }}; do
      apt-cache policy "$p" 2>/dev/null | grep -Eq '^[[:space:]]*Candidate:[[:space:]]+[^([:space:]]' || echo "$p"
    done
    exit 0
  register: common_packages_missing
  changed_when: false
  check_mode: false

- name: Packages | Refresh the package lists (a package has no install candidate)
  ansible.builtin.apt:
    update_cache: true
  changed_when: false # only the package lists change, nothing is installed
  when:
    - common_packages_missing.stdout_lines | length > 0
    - not ansible_check_mode

- name: Packages | Install {{ common_packages | join(', ') }}
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not (ansible_check_mode and common_packages_missing.stdout_lines | length > 0)

- name: Packages | Check mode - package lists would be refreshed first
  ansible.builtin.debug:
    msg: >-
      --check: apt has no install candidate yet for {{ common_packages_missing.stdout_lines | join(', ') }};
      a real run refreshes the package lists (apt-get update) and installs {{ common_packages | join(', ') }}.
  when: ansible_check_mode and common_packages_missing.stdout_lines | length > 0
