---
# CI only: the disposable container started by .github/workflows/ci.yml
all:
  children:
    hardening_targets:
      hosts:
        target:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ciadmin
          ansible_ssh_private_key_file: ci/.ssh/id_ed25519
          ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          ansible_python_interpreter: /usr/bin/python3
