---
# Audit-first server hardening.
#
#   Audit only (default, changes nothing):
#     ansible-playbook site.yml
#   Preview ONE category, then apply it:
#     ansible-playbook site.yml --tags ssh -e ssh_hardening_apply=true --check --diff
#     ansible-playbook site.yml --tags ssh -e ssh_hardening_apply=true
#
# Tags: audit, ssh, firewall, auto_updates, fail2ban, sysctl, accounts, file_permissions
# Every category role first runs a read-only preflight (also tagged "audit"),
# and changes something only when its *_apply switch is true.
- name: Server hardening - audit first, apply only what you opt into
  hosts: hardening_targets
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [always]
    - role: ssh_hardening
      tags: [ssh]
    - role: firewall
      tags: [firewall]
    - role: auto_updates
      tags: [auto_updates]
    - role: fail2ban
      tags: [fail2ban]
    - role: sysctl_network
      tags: [sysctl]
    - role: accounts
      tags: [accounts]
    - role: file_permissions
      tags: [file_permissions]
    # Last: collects what the preflights found and writes the report.
    - role: audit
      tags: [audit]
