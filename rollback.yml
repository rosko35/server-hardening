---
# Undo server-hardening changes using the backups on the server.
#   List only:   ansible-playbook rollback.yml
#   Restore all: ansible-playbook rollback.yml -e rollback_confirm=true
#   One area:    ansible-playbook rollback.yml -e rollback_confirm=true -e rollback_categories=ssh
# Categories: all, ssh, firewall, auto_updates, fail2ban, sysctl, accounts, file_permissions
- name: Roll back server-hardening changes
  hosts: hardening_targets
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [always]
    - role: rollback
      tags: [rollback]
