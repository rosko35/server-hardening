# Ansible ignores this file if the directory is world-writable (e.g. /mnt/c in WSL).
# Clone the repository inside your Linux home directory instead.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
filter_plugins = filter_plugins
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
forks = 5
timeout = 30
# Human-readable task output (also makes CI failures easier to read)
callback_result_format = yaml
display_skipped_hosts = True
nocows = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
